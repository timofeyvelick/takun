<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена | takun.space</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-1: #dceafa;
    --bg-2: #b8d4f0;
    --bg-3: #e8f0fa;
    --text: #0a1b2e;
    --text-muted: #5a6a7e;
    --accent: #247ad6;
    --accent-soft: rgba(36, 122, 214, 0.15);
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.7);
    --glass-highlight: rgba(255, 255, 255, 0.9);
    --glass-shadow: rgba(10, 27, 46, 0.12);
  }

  html.dark {
    --bg-1: #0a0e1a;
    --bg-2: #131826;
    --bg-3: #1a2035;
    --text: #e8eaed;
    --text-muted: #9aa0a6;
    --accent: #4a9eff;
    --accent-soft: rgba(74, 158, 255, 0.15);
    --glass-bg: rgba(30, 38, 60, 0.55);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --glass-shadow: rgba(0, 0, 0, 0.4);
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-1);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.5s, color 0.5s;
    position: relative;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    transition: background 0.5s;
  }

  body::before {
    width: 500px;
    height: 500px;
    background: var(--bg-2);
    top: -150px;
    left: -150px;
    animation: float1 18s ease-in-out infinite;
  }

  body::after {
    width: 600px;
    height: 600px;
    background: var(--bg-3);
    bottom: -200px;
    right: -200px;
    animation: float2 22s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.1); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-80px, -60px) scale(1.15); }
  }

  .glass {
    position: relative;
    z-index: 1;
    background: var(--glass-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-radius: 28px;
    padding: 64px 48px 48px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    border: 1px solid var(--glass-border);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      inset 0 1px 0 var(--glass-highlight),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  .glass::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
    opacity: 0.8;
  }

  .glass::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 30px;
    background: linear-gradient(135deg, var(--accent-soft), transparent 60%);
    z-index: -1;
    opacity: 0.6;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .code {
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
    color: var(--accent);
    margin-bottom: 24px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--accent), var(--text));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 14px;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-muted);
    margin-bottom: 32px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 26px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 100px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid transparent;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 4px 16px var(--accent-soft);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px var(--accent-soft);
    filter: brightness(1.08);
  }

  .btn-secondary {
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    border-color: var(--glass-border);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }

  .theme-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: all 0.25s;
    box-shadow: 0 4px 16px var(--glass-shadow);
  }

  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: rotate(15deg) scale(1.05);
  }

  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .icon-moon { display: none; }
  html.dark .theme-toggle .icon-sun { display: none; }
  html.dark .theme-toggle .icon-moon { display: block; }

  @media (max-width: 640px) {
    .glass { padding: 48px 28px 32px; border-radius: 24px; }
    .code { font-size: 72px; }
    h1 { font-size: 22px; }
    p { font-size: 14px; }
    .btn { padding: 12px 22px; font-size: 13px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<main class="glass">
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Кажется, эта страница куда-то потерялась. Возможно, ссылка устарела или была перемещена.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      На главную
    </a>
    <a href="/private.html" class="btn btn-secondary">Приватный раздел</a>
  </div>
</main>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }

  themeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });
</script>

</body>
</html>
